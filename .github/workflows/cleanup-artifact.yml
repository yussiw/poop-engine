
name: Cleanup old artifacts

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep latest 2 artifacts per workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );

            const runs = new Map();
            const groups = new Map();

            for (const artifact of artifacts) {
              const runId = artifact.workflow_run?.id;
              if (!runId) continue;

              let workflowId = runs.get(runId);

              if (!workflowId) {
                const run = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: runId
                });

                workflowId = run.data.workflow_id;
                runs.set(runId, workflowId);
              }

              if (!groups.has(workflowId)) {
                groups.set(workflowId, []);
              }

              groups.get(workflowId).push(artifact);
            }

            let deleted = 0;

            for (const [workflowId, items] of groups) {
              items.sort((a, b) =>
                new Date(b.created_at) - new Date(a.created_at)
              );

              for (const artifact of items.slice(2)) {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id
                });

                deleted++;
                core.info(`Deleted ${artifact.name} (${artifact.id})`);
              }

              core.info(`Workflow ${workflowId}: kept ${Math.min(2, items.length)} artifacts.`);
            }

            core.info(`Cleanup finished. Deleted ${deleted} artifacts.`);