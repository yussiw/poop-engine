name: Build Android APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r21e

      - name: Instalar libs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.2 --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib install flixel 5.6.1 --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install extension-androidtools --quiet
          haxelib run lime setup -y

      - name: Configurar Android SDK/NDK
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "${{ steps.ndk.outputs.ndk-path }}"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Assinatura fixa (sem isso o APK novo nao instala por cima do antigo)
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 nao definido: cada build sai com uma assinatura diferente e a atualizacao dentro do jogo vai falhar."
          fi

      - name: Compilar
        run: haxelib run lime build android -final

      - uses: actions/upload-artifact@v4
        with:
          name: PoopEngine-apk
          path: export/release/android/bin/app/build/outputs/apk/**/*.apk

      - name: Publicar release (nightly) pra atualizacao dentro do jogo
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=${GITHUB_SHA::7}
          APK=$(find export/release/android/bin/app/build/outputs/apk -name '*.apk' | head -n1)
          cp "$APK" "PoopEngine-$SHORT.apk"
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly "PoopEngine-$SHORT.apk" --target "$GITHUB_SHA" --title "Poop Engine $SHORT" --notes "$(git log -1 --pretty=%s)" --prerelease
